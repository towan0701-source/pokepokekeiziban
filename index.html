<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケポケ対戦掲示板 | Pokémon TCG Pocket Matchmaking</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter & Noto Sans JP) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        poke: {
                            gold: '#FFCB05',
                            goldDark: '#D4A300',
                            blue: '#2A75BB',
                            blueDark: '#1C4B79',
                            dark: '#0F172A',
                            card: '#1E293B',
                            accent: '#EC4899',
                            emerald: '#10B981'
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans JP', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbars and styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0F172A;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .bg-glass {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-poke-gold selection:text-slate-900">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-lg">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-poke-gold to-yellow-300 flex items-center justify-center text-slate-900 shadow-md font-black text-xl">
                    <i class="fa-solid font-bold">P</i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-wider bg-gradient-to-r from-poke-gold via-white to-sky-400 bg-clip-text text-transparent">
                        ポケポケ対戦掲示板
                    </h1>
                    <p class="text-xs text-slate-400 font-medium">Pokémon TCG Pocket Matchmaking</p>
                </div>
            </div>

            <!-- Stats & Quick Actions -->
            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700 text-xs text-slate-300">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>アクティブ募集: <strong id="activeCount" class="text-poke-gold font-bold">0</strong>件</span>
                </div>
                <button onclick="scrollToForm()" class="bg-gradient-to-r from-poke-gold to-amber-500 hover:from-yellow-400 hover:to-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl shadow-lg shadow-amber-500/20 hover:shadow-amber-500/40 transition duration-200 text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">募集を作成</span>
                    <span class="sm:hidden">募集</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Layout Container -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Sidebar / Recruitment Form -->
        <section class="lg:col-span-4 space-y-6">
            <div id="formCard" class="bg-glass rounded-2xl border border-slate-800 p-5 shadow-xl sticky top-20">
                <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-800">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-paper-plane text-poke-gold"></i>
                        対戦相手を募集
                    </h2>
                    <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full border border-slate-700">即時更新</span>
                </div>

                <form id="recruitmentForm" class="space-y-4" onsubmit="handlePostSubmit(event)">
                    <!-- Name -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">
                            プレイヤー名 <span class="text-rose-400">*</span>
                        </label>
                        <input type="text" id="playerName" required placeholder="例: トレナー名" maxlength="12"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-poke-gold focus:border-transparent transition">
                    </div>

                    <!-- Code Type Selection -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">募集方式</label>
                            <select id="codeType" onchange="toggleCodeTypeInput()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-poke-gold transition cursor-pointer">
                                <option value="あい言葉">あい言葉 (パス)</option>
                                <option value="フレンドID">フレンドID</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">
                                <span id="codeLabelText">あい言葉</span> <span class="text-rose-400">*</span>
                            </label>
                            <input type="text" id="matchCode" required placeholder="例: 1234-5678" maxlength="20"
                                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-poke-gold focus:border-transparent transition">
                        </div>
                    </div>

                    <!-- Rule Select -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">対戦ルール</label>
                        <select id="matchRule" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-poke-gold transition cursor-pointer">
                            <option value="エンジョイ">エンジョイ (フリー対戦)</option>
                            <option value="ガチ対戦">ガチ対戦 (ガチデッキ)</option>
                            <option value="初心者歓迎">初心者歓迎 (ゆっくり)</option>
                            <option value="デッキ試運転">デッキ試運転 / 検証</option>
                            <option value="15pt獲得周回">15pt周回 / スピード戦</option>
                        </select>
                    </div>

                    <!-- Deck / Style Tags -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">使用デッキ (任意)</label>
                        <input type="text" id="deckName" placeholder="例: ミュウツーEX, ピカチュウEX" maxlength="25"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-poke-gold focus:border-transparent transition">
                    </div>

                    <!-- Comment / Note -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">一言メッセージ</label>
                        <textarea id="postComment" rows="2" placeholder="例: どなたでも気軽に入ってください！" maxlength="80"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-poke-gold focus:border-transparent transition resize-none"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" 
                        class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-500/25 transition duration-200 flex items-center justify-center space-x-2 group">
                        <i class="fa-solid fa-paper-plane group-hover:translate-x-1 transition-transform"></i>
                        <span>対戦募集を投稿する</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- Right Main Board -->
        <section class="lg:col-span-8 space-y-5">
            <!-- Filters & Search Bar Component -->
            <div class="bg-glass rounded-2xl border border-slate-800 p-4 shadow-md space-y-3">
                <div class="flex flex-col sm:flex-row gap-3 justify-between items-center">
                    
                    <!-- Search Input -->
                    <div class="relative w-full sm:w-72">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                        <input type="text" id="searchInput" oninput="renderPosts()" placeholder="名前・デッキ・コードで検索..."
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-8 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-poke-gold transition">
                    </div>

                    <!-- Quick Rule Filter Chips -->
                    <div class="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
                        <button onclick="setRuleFilter('ALL', this)" class="filter-chip bg-poke-gold text-slate-900 font-bold text-xs px-3 py-1.5 rounded-lg border border-poke-gold transition whitespace-nowrap">
                            すべて
                        </button>
                        <button onclick="setRuleFilter('エンジョイ', this)" class="filter-chip text-xs px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:border-slate-500 transition font-medium whitespace-nowrap">
                            エンジョイ
                        </button>
                        <button onclick="setRuleFilter('ガチ対戦', this)" class="filter-chip text-xs px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:border-slate-500 transition font-medium whitespace-nowrap">
                            ガチ対戦
                        </button>
                        <button onclick="setRuleFilter('初心者歓迎', this)" class="filter-chip text-xs px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:border-slate-500 transition font-medium whitespace-nowrap">
                            初心者
                        </button>
                        <button onclick="setRuleFilter('15pt獲得周回', this)" class="filter-chip text-xs px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:border-slate-500 transition font-medium whitespace-nowrap">
                            15pt周回
                        </button>
                    </div>
                </div>
            </div>

            <!-- Board Posts Feed -->
            <div id="postsFeed" class="space-y-4">
                <!-- Posts will be rendered dynamically -->
            </div>

            <!-- Empty State Display -->
            <div id="emptyState" class="bg-slate-900/50 rounded-2xl border border-slate-800 p-12 text-center">
                <i class="fa-solid fa-gamepad text-4xl text-slate-600 mb-3"></i>
                <p class="text-slate-300 font-bold text-base mb-1">現在募集中の対戦はありません</p>
                <p class="text-slate-400 text-xs">左のフォームから対戦相手を募集してみましょう！</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-950 py-6 text-center text-xs text-slate-500">
        <div class="max-w-6xl mx-auto px-4 space-y-2">
            <p>※当サイトは任天堂および株式会社ポケモン等の公式とは一切関係ありません。</p>
            <p>&copy; ポケポケ対戦掲示板 Fan Matchmaking Portal</p>
        </div>
    </footer>

    <!-- Toast Notification Element -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 ease-out pointer-events-none">
        <div class="bg-slate-800 text-white border border-slate-700 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3">
            <div id="toastIcon" class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                <i class="fa-solid fa-check"></i>
            </div>
            <div>
                <p id="toastTitle" class="text-xs font-bold text-slate-200">通知</p>
                <p id="toastMessage" class="text-xs text-slate-400">メッセージ本文</p>
            </div>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // Load initial posts strictly from LocalStorage (NO dummy NPCs like Red/Green)
        let posts = JSON.parse(localStorage.getItem('pokepoke_user_posts') || '[]');
        let activeRuleFilter = 'ALL';

        window.onload = function() {
            renderPosts();
            updateActiveCount();
        };

        // Save posts to browser storage
        function savePosts() {
            localStorage.setItem('pokepoke_user_posts', JSON.stringify(posts));
        }

        // Toggle label based on code type selection
        function toggleCodeTypeInput() {
            const type = document.getElementById('codeType').value;
            document.getElementById('codeLabelText').innerText = type;
            document.getElementById('matchCode').placeholder = type === 'あい言葉' ? '例: 1234-5678' : '例: 1234-5678-9012';
        }

        // Handle Post Submission
        function handlePostSubmit(e) {
            e.preventDefault();

            const name = document.getElementById('playerName').value.trim();
            const codeType = document.getElementById('codeType').value;
            const code = document.getElementById('matchCode').value.trim();
            const rule = document.getElementById('matchRule').value;
            const deck = document.getElementById('deckName').value.trim();
            const comment = document.getElementById('postComment').value.trim();

            if (!name || !code) {
                showToast("エラー", "名前とコードを入力してください", "error");
                return;
            }

            const newPost = {
                id: Date.now(),
                name: name,
                codeType: codeType,
                code: code,
                rule: rule,
                deck: deck || "指定なし",
                comment: comment || "対戦よろしくお願いします！",
                status: "RECRUITING",
                createdAt: new Date().toISOString(),
                replies: []
            };

            posts.unshift(newPost);
            savePosts();
            renderPosts();
            updateActiveCount();

            // Clear comment inputs
            document.getElementById('postComment').value = '';
            document.getElementById('deckName').value = '';

            showToast("投稿完了", "対戦募集を掲載しました！", "success");
        }

        // Set rule filter chip
        function setRuleFilter(rule, btnElement) {
            activeRuleFilter = rule;
            document.querySelectorAll('.filter-chip').forEach(btn => {
                btn.className = "filter-chip text-xs px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:border-slate-500 transition font-medium whitespace-nowrap";
            });
            btnElement.className = "filter-chip bg-poke-gold text-slate-900 font-bold text-xs px-3 py-1.5 rounded-lg border border-poke-gold transition whitespace-nowrap";
            renderPosts();
        }

        // Render Posts Feed
        function renderPosts() {
            const feedContainer = document.getElementById('postsFeed');
            const emptyState = document.getElementById('emptyState');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

            feedContainer.innerHTML = '';

            const filteredPosts = posts.filter(post => {
                const matchRule = activeRuleFilter === 'ALL' || post.rule === activeRuleFilter;
                const matchQuery = !searchQuery || 
                    post.name.toLowerCase().includes(searchQuery) ||
                    post.deck.toLowerCase().includes(searchQuery) ||
                    post.comment.toLowerCase().includes(searchQuery) ||
                    post.code.toLowerCase().includes(searchQuery);

                return matchRule && matchQuery;
            });

            if (filteredPosts.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filteredPosts.forEach(post => {
                const postCard = document.createElement('div');
                postCard.className = `bg-glass rounded-2xl border transition duration-200 p-5 shadow-lg relative ${
                    post.status === 'MATCHED' ? 'border-slate-800 opacity-60' : 'border-slate-800 hover:border-slate-700'
                }`;

                let ruleBadgeColor = "bg-blue-500/20 text-blue-400 border-blue-500/30";
                if (post.rule === "ガチ対戦") ruleBadgeColor = "bg-rose-500/20 text-rose-400 border-rose-500/30";
                if (post.rule === "初心者歓迎") ruleBadgeColor = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";
                if (post.rule === "15pt獲得周回") ruleBadgeColor = "bg-amber-500/20 text-amber-400 border-amber-500/30";

                let statusBadge = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>対戦相手募集中
                </span>`;
                if (post.status === 'MATCHED') {
                    statusBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700">対戦完了</span>`;
                }

                const timeAgo = formatTimeAgo(new Date(post.createdAt));

                postCard.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-slate-800">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-slate-700 to-slate-800 border border-slate-600 flex items-center justify-center text-poke-gold font-bold text-base shadow">
                                ${escapeHtml(post.name.charAt(0))}
                            </div>
                            <div>
                                <div class="flex items-center space-x-2">
                                    <h3 class="font-bold text-white text-base">${escapeHtml(post.name)}</h3>
                                    <span class="text-xs text-slate-400">${timeAgo}</span>
                                </div>
                                <div class="flex items-center gap-2 mt-0.5">
                                    <span class="text-xs px-2 py-0.5 rounded border ${ruleBadgeColor}">${post.rule}</span>
                                    ${post.deck ? `<span class="text-xs text-slate-400"><i class="fa-solid fa-clone text-slate-500 mr-1"></i>${escapeHtml(post.deck)}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            ${statusBadge}
                            <button onclick="deletePost(${post.id})" class="text-slate-500 hover:text-rose-400 p-1.5 text-xs transition" title="この投稿を削除">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Match Code Box -->
                    <div class="my-3.5 bg-slate-900/90 rounded-xl p-3 border border-slate-800 flex items-center justify-between">
                        <div>
                            <span class="text-[10px] uppercase tracking-wider font-bold text-slate-400 block">${post.codeType}</span>
                            <span class="font-mono text-lg font-bold text-poke-gold tracking-wide select-all">${escapeHtml(post.code)}</span>
                        </div>
                        <button onclick="copyToClipboard('${escapeHtml(post.code)}', '${post.codeType}')" 
                            class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 border border-slate-700 hover:border-slate-600 px-3.5 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1.5 group">
                            <i class="fa-regular fa-copy group-hover:scale-110 transition-transform"></i>
                            <span>コピー</span>
                        </button>
                    </div>

                    <!-- Comment -->
                    <p class="text-sm text-slate-300 mb-4 whitespace-pre-wrap leading-relaxed">${escapeHtml(post.comment)}</p>

                    <!-- Bottom Bar -->
                    <div class="flex items-center justify-between pt-3 border-t border-slate-800/60 text-xs">
                        <button onclick="toggleReplies(${post.id})" class="text-slate-400 hover:text-poke-gold transition flex items-center gap-1.5">
                            <i class="fa-regular fa-comment"></i>
                            <span>コメント (${(post.replies || []).length})</span>
                        </button>

                        <div>
                            ${post.status === 'RECRUITING' ? `
                                <button onclick="changeStatus(${post.id}, 'MATCHED')" class="text-slate-400 hover:text-emerald-400 transition">完了にする</button>
                            ` : `
                                <button onclick="changeStatus(${post.id}, 'RECRUITING')" class="text-slate-400 hover:text-poke-gold transition">募集を再開</button>
                            `}
                        </div>
                    </div>

                    <!-- Reply Container -->
                    <div id="replyContainer-${post.id}" class="hidden mt-4 pt-4 border-t border-slate-800/80 space-y-3">
                        <div id="repliesList-${post.id}" class="space-y-2">
                            ${(post.replies || []).map(r => `
                                <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800 text-xs space-y-1">
                                    <div class="flex justify-between text-slate-400">
                                        <span class="font-bold text-slate-300">${escapeHtml(r.name)}</span>
                                        <span class="text-[10px]">${r.time}</span>
                                    </div>
                                    <p class="text-slate-300">${escapeHtml(r.comment)}</p>
                                </div>
                            `).join('')}
                        </div>

                        <div class="flex gap-2">
                            <input type="text" id="replyInput-${post.id}" placeholder="返信メッセージを入力..." 
                                class="flex-grow bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-poke-gold">
                            <button onclick="addReply(${post.id})" class="bg-slate-800 hover:bg-slate-700 text-poke-gold font-bold px-3 py-1.5 rounded-lg text-xs transition border border-slate-700">
                                返信
                            </button>
                        </div>
                    </div>
                `;

                feedContainer.appendChild(postCard);
            });
        }

        // Toggle replies view
        function toggleReplies(postId) {
            const container = document.getElementById(`replyContainer-${postId}`);
            if (container) {
                container.classList.toggle('hidden');
            }
        }

        // Add Reply
        function addReply(postId) {
            const input = document.getElementById(`replyInput-${postId}`);
            const comment = input.value.trim();
            if (!comment) return;

            const post = posts.find(p => p.id === postId);
            if (post) {
                if (!post.replies) post.replies = [];
                post.replies.push({
                    name: "対戦希望者",
                    comment: comment,
                    time: "たった今"
                });
                savePosts();
                renderPosts();
                showToast("返信追加", "コメントを送信しました", "success");
            }
        }

        // Change Status
        function changeStatus(postId, newStatus) {
            const post = posts.find(p => p.id === postId);
            if (post) {
                post.status = newStatus;
                savePosts();
                renderPosts();
                updateActiveCount();
                showToast("ステータス変更", newStatus === 'MATCHED' ? "対戦済みに変更しました" : "募集を再開しました", "info");
            }
        }

        // Delete Single Post
        function deletePost(postId) {
            posts = posts.filter(p => p.id !== postId);
            savePosts();
            renderPosts();
            updateActiveCount();
            showToast("削除完了", "投稿を削除しました", "success");
        }

        // Copy Code Helper
        function copyToClipboard(text, type) {
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);

            showToast("コピー完了", `${type} [ ${text} ] をコピーしました。`, "success");
        }

        // Toast Notification System
        function showToast(title, message, type = "success") {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');

            toastTitle.innerText = title;
            toastMessage.innerText = message;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Scroll to form on mobile
        function scrollToForm() {
            document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
        }

        // Active match counter
        function updateActiveCount() {
            const count = posts.filter(p => p.status === 'RECRUITING').length;
            document.getElementById('activeCount').innerText = count;
        }

        // Time ago helper
        function formatTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return "たった今";
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}分前`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}時間前`;
            return `${Math.floor(hours / 24)}日前`;
        }

        // Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
